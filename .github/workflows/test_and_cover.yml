name: Test and Cover
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-cover-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Run tests with coverage
        run: make cover

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: cover_lines.out
          format: golang

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Run tests
        run: make test

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Build
        shell: cmd
        run: .\build_win.bat

      - name: List tunnels
        shell: cmd
        run: .\dist\boring.exe l
        env:
          DEBUG: 1
          BORING_FORCE_INTERACTIVE: 1

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25

      # Hyper-V reserves random port ranges, which can include the test ports
      - name: Release reserved ports
        run: |
          if ((Get-Service winnat).Status -eq 'Running') { net stop winnat }
          netsh int ipv4 show excludedportrange protocol=tcp

      - name: Run tests
        shell: bash
        run: make test
